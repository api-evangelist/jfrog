      - name: Multisite federation
      - name: Advanced distribution
      - name: Application governance
      - name: Premium support
  - id: jfrog-security-bundles
    name: Security Bundles (add-on)
    type: subscription
    description: Optional Security bundles layered on Cloud or Self-Managed. Unified Security covers
      curation, advanced security, and agentic remediation; Ultimate Security adds AI Catalog and AppTrust.
    entries:
      - label: Bundle subscription
        name: security_bundle
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Curation
      - name: Advanced security
      - name: Agentic remediation
      - name: AI Catalog (Ultimate)
      - name: AppTrust (Ultimate)
  - id: jfrog-mlops-bundles
    name: MLOps Bundles (add-on)
    type: subscription
    description: Optional MLOps bundles. Unified MLOps covers model registry, experiment tracking,
