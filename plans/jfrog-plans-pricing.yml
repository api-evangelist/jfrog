description: JFrog is sold in two delivery modes — JFrog SaaS (Cloud) and Self-Managed — each priced
  in tiers (Pro, Enterprise X, Enterprise+) with a base monthly storage allotment, tiered overage rates
  on storage and data transfer, and optional Security and MLOps bundles. Enterprise+ and self-managed
  Enterprise+ are quoted by sales.
sources:
  - https://jfrog.com/pricing/
  - https://jfrog.com/help/r/jfrog-platform-administration-documentation/jfrog-subscriptions
plans:
  - id: jfrog-saas-pro
    name: JFrog Cloud — Pro
    type: subscription
    description: Entry-level JFrog SaaS subscription with 25 GB monthly base consumption, Artifactory
      universal repo, container and ML model registries, and CI/CD integrations.
    entries:
      - label: Monthly base
        name: pro_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '150.00'
        userMultiplied: false
      - label: Included consumption
        name: pro_included_consumption
        type: quota
        metric: GB
        limit: 25
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Overage 25–1,204 GB
        name: pro_overage_tier1
        type: tiered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '1.25'
        userMultiplied: false
      - label: Overage 1,204–2,024 GB
        name: pro_overage_tier2
        type: tiered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '1.00'
        userMultiplied: false
      - label: Overage 2,024+ GB
        name: pro_overage_tier3
        type: tiered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.75'
        userMultiplied: false
    elements:
      - name: Universal binary repository
      - name: Container registry
      - name: ML model registry
      - name: CI/CD integrations
      - name: Community support
  - id: jfrog-saas-enterprise-x
    name: JFrog Cloud — Enterprise X
    type: subscription
    description: Production-grade JFrog SaaS with 125 GB monthly base, high availability (99.9% uptime
      SLA), artifact federation, automated cleanup, SSO/SAML, 24/7 SLA support.
    entries:
      - label: Monthly base
        name: ex_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '950.00'
        userMultiplied: false
      - label: Included consumption
        name: ex_included_consumption
        type: quota
        metric: GB
        limit: 125
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Overage
        name: ex_overage
        type: tiered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see vendor pricing calculator
        userMultiplied: false
    elements:
      - name: Everything in Pro
      - name: 99.9% uptime SLA
      - name: Artifact federation
      - name: Automated cleanup policies
      - name: SSO / SAML
      - name: GitHub integration
      - name: 24/7 SLA support
  - id: jfrog-saas-enterprise-plus
    name: JFrog Cloud — Enterprise+
    type: enterprise
    description: Top tier JFrog SaaS with custom consumption, multisite federation, distribution, advanced
      network topologies, evidence collection, application governance, and high-touch 24/7 support with
      a named technical account lead.
    entries:
      - label: Subscription
        name: ep_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Everything in Enterprise X
      - name: Multisite federation
      - name: Distribution + edge nodes
      - name: Advanced network topologies
      - name: Evidence collection
      - name: Application governance
      - name: 24/7 high-touch support, named TAM
  - id: jfrog-selfmanaged-pro-x
    name: JFrog Self-Managed — Pro X
    type: subscription
    description: Self-hosted JFrog Pro X starting at $27,000/year, includes 1 server, universal binary
      management, container registry, ML model registry.
    entries:
      - label: Annual subscription
        name: pro_x_annual
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: '27000.00'
        userMultiplied: false
    elements:
