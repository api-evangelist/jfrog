      - name: Container registry
      - name: ML model registry
      - name: 1 included server
  - id: jfrog-selfmanaged-enterprise-x
    name: JFrog Self-Managed — Enterprise X
    type: subscription
    description: Self-hosted Enterprise X starting at $51,000/year, includes 3 servers, high availability,
      federation, automated cleanup, enterprise access controls, security scanning.
    entries:
      - label: Annual subscription
        name: enterprise_x_annual
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
