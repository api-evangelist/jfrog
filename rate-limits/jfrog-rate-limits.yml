specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: JFrog
providerId: jfrog
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Rate Limiting
  - DevOps
  - Artifactory
  - Container Registry
  - Software Supply Chain
description: JFrog Cloud applies per-instance / per-tenant fair-use throttling on the Artifactory,
  Xray, Distribution, Pipelines, and Curation REST APIs; numeric request-per-second limits are not
  published at the platform level. Self-managed Artifactory has no provider-side rate limit and is
  bounded by the customer's hardware. Public download endpoints (e.g., the JFrog public registry mirror)
  enforce anonymous and authenticated download caps to protect shared bandwidth.
sources:
  - https://jfrog.com/help/r/jfrog-rest-apis/rate-limits
  - https://jfrog.com/help/r/jfrog-platform-administration-documentation/jfrog-subscriptions
  - https://jfrog.com/help/r/jfrog-platform-administration-documentation/access-tokens
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: JFrog Cloud — REST API (per tenant)
    scope: account
    metric: varies
    limit: per-tenant fair use (raise via support)
    notes: Cloud tenants share rate-limit pools sized to their subscription tier (Pro, Enterprise X,
      Enterprise+). Sustained throughput beyond fair-use returns 429.
  - name: JFrog Self-Managed
    scope: server
    metric: varies
    limit: bounded by self-hosted capacity
    notes: No platform-imposed rate limit on self-managed deployments; throughput is governed by your
      hardware and database.
  - name: Public mirror — anonymous download
    scope: IP
    metric: requests_per_hour
    limit: 'see public registry policy'
    notes: Anonymous pulls from JFrog-hosted public mirrors (e.g., jfrog.io public registries) are
      throttled per IP to prevent abuse; authenticate to lift.
policies:
  - name: Backoff
    description: Honor Retry-After on 429 / 503 responses; back off exponentially with jitter.
  - name: Tier scaling
    description: Pro tenants share lower fair-use ceilings than Enterprise X; raise via support if
      sustained 429s appear.
  - name: Authenticate
    description: Authenticate to public registry endpoints to receive higher per-token limits than
      anonymous IP-bound caps.
  - name: Self-hosted vs SaaS
    description: Self-managed installations have no provider rate limit; SaaS tenants are subject to
      JFrog's gateway throttling.
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
