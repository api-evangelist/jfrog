      description: REST surface for api-security-groups-groupName.
      operations:
      - method: GET
        name: getgroup
        description: JFrog Get Group Details
        call: artifactory-security.getgroup
        with:
          groupName: rest.groupName
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: createorreplacegroup
