      description: REST surface for api-security-token.
      operations:
      - method: POST
        name: createtoken
        description: JFrog Create Access Token
        call: artifactory-security.createtoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/security/users
