naftiko: 1.0.0-alpha2
info:
  label: JFrog Artifactory REST API — Security
  description: 'JFrog Artifactory REST API — Security. 13 operations. Lead operation: JFrog List Groups. Self-contained Naftiko
    capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Security
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
