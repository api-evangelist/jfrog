        description: JFrog Get User Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: username
          in: path
          type: string
          description: Username
          required: true
      - name: createorreplaceuser
        method: PUT
        description: JFrog Create or Replace User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: username
          in: path
          type: string
          description: Username
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteuser
        method: DELETE
        description: JFrog Delete User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
