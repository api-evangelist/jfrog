    baseUri: https://{server}.jfrog.io/artifactory
    description: JFrog Artifactory REST API — Security business capability. Self-contained, no shared references.
    resources:
    - name: api-security-groups
      path: /api/security/groups
      operations:
      - name: listgroups
        method: GET
        description: JFrog List Groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-security-groups-groupName
      path: /api/security/groups/{groupName}
      operations:
      - name: getgroup
        method: GET
        description: JFrog Get Group Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: groupName
          in: path
          type: string
          description: Group name
          required: true
      - name: createorreplacegroup
        method: PUT
        description: JFrog Create or Replace Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: groupName
          in: path
          type: string
          description: Group name
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletegroup
        method: DELETE
        description: JFrog Delete Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: groupName
          in: path
          type: string
          description: Group name
          required: true
    - name: api-security-permissions
      path: /api/security/permissions
      operations:
      - name: listpermissiontargets
        method: GET
        description: JFrog List Permission Targets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-security-permissions-permissionTargetName
      path: /api/security/permissions/{permissionTargetName}
      operations:
      - name: getpermissiontarget
        method: GET
        description: JFrog Get Permission Target
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: permissionTargetName
          in: path
          type: string
          description: Permission target name
          required: true
      - name: createorreplacepermissiontarget
        method: PUT
        description: JFrog Create or Replace Permission Target
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: permissionTargetName
          in: path
          type: string
          description: Permission target name
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletepermissiontarget
        method: DELETE
        description: JFrog Delete Permission Target
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: permissionTargetName
          in: path
          type: string
          description: Permission target name
          required: true
    - name: api-security-token
      path: /api/security/token
      operations:
      - name: createtoken
        method: POST
        description: JFrog Create Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
