naftiko: 1.0.0-alpha2
info:
  label: JFrog Workers REST API — Execution
  description: 'JFrog Workers REST API — Execution. 2 operations. Lead operation: JFrog Get Worker Logs. Self-contained Naftiko
    capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Execution
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: workers-execution
    baseUri: https://{server}.jfrog.io/worker/api
    description: JFrog Workers REST API — Execution business capability. Self-contained, no shared references.
    resources:
    - name: v1-workers-workerKey-logs
      path: /v1/workers/{workerKey}/logs
      operations:
      - name: getworkerlogs
        method: GET
        description: JFrog Get Worker Logs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: workerKey
          in: path
          type: string
          description: Worker key identifier
          required: true
        - name: from
          in: query
          type: string
          description: Start time for log retrieval
        - name: to
          in: query
          type: string
          description: End time for log retrieval
    - name: v1-workers-workerKey-test
      path: /v1/workers/{workerKey}/test
      operations:
      - name: testworker
        method: POST
        description: JFrog Test Worker
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: workerKey
          in: path
          type: string
          description: Worker key identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: workers-execution-rest
    port: 8080
    description: REST adapter for JFrog Workers REST API — Execution. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/workers/{workerkey}/logs
      name: v1-workers-workerkey-logs
      description: REST surface for v1-workers-workerKey-logs.
      operations:
      - method: GET
        name: getworkerlogs
        description: JFrog Get Worker Logs
        call: workers-execution.getworkerlogs
        with:
          workerKey: rest.workerKey
          from: rest.from
          to: rest.to
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/workers/{workerkey}/test
      name: v1-workers-workerkey-test
      description: REST surface for v1-workers-workerKey-test.
      operations:
      - method: POST
        name: testworker
        description: JFrog Test Worker
        call: workers-execution.testworker
        with:
          workerKey: rest.workerKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: workers-execution-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Workers REST API — Execution. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: jfrog-get-worker-logs
      description: JFrog Get Worker Logs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: workers-execution.getworkerlogs
      with:
        workerKey: tools.workerKey
        from: tools.from
        to: tools.to
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-test-worker
      description: JFrog Test Worker
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: workers-execution.testworker
      with:
        workerKey: tools.workerKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
