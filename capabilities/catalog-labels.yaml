naftiko: 1.0.0-alpha2
info:
  label: JFrog Catalog REST API — Labels
  description: 'JFrog Catalog REST API — Labels. 7 operations. Lead operation: JFrog List Labels. Self-contained Naftiko capability
    covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Labels
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: catalog-labels
    baseUri: https://{server}.jfrog.io/catalog/api/v1
    description: JFrog Catalog REST API — Labels business capability. Self-contained, no shared references.
    resources:
    - name: labels
      path: /labels
      operations:
      - name: listlabels
        method: GET
        description: JFrog List Labels
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createlabel
        method: POST
        description: JFrog Create Label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: labels-labelName
      path: /labels/{labelName}
      operations:
      - name: getlabel
        method: GET
        description: JFrog Get Label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: labelName
          in: path
          type: string
          description: Label name
          required: true
      - name: updatelabel
        method: PUT
        description: JFrog Update Label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: labelName
          in: path
          type: string
          description: Label name
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletelabel
        method: DELETE
        description: JFrog Delete Label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: labelName
          in: path
          type: string
          description: Label name
          required: true
    - name: labels-labelName-packages
      path: /labels/{labelName}/packages
      operations:
      - name: applylabeltopackages
        method: POST
        description: JFrog Apply Label to Packages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: labelName
          in: path
          type: string
          description: Label name
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: removelabelfrompackages
        method: DELETE
        description: JFrog Remove Label from Packages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: labelName
          in: path
          type: string
          description: Label name
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: catalog-labels-rest
    port: 8080
    description: REST adapter for JFrog Catalog REST API — Labels. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/labels
      name: labels
      description: REST surface for labels.
      operations:
      - method: GET
        name: listlabels
        description: JFrog List Labels
        call: catalog-labels.listlabels
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createlabel
        description: JFrog Create Label
        call: catalog-labels.createlabel
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/labels/{labelname}
      name: labels-labelname
      description: REST surface for labels-labelName.
      operations:
      - method: GET
        name: getlabel
        description: JFrog Get Label
        call: catalog-labels.getlabel
        with:
          labelName: rest.labelName
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatelabel
        description: JFrog Update Label
        call: catalog-labels.updatelabel
        with:
          labelName: rest.labelName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletelabel
        description: JFrog Delete Label
        call: catalog-labels.deletelabel
        with:
          labelName: rest.labelName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/labels/{labelname}/packages
      name: labels-labelname-packages
      description: REST surface for labels-labelName-packages.
      operations:
      - method: POST
        name: applylabeltopackages
        description: JFrog Apply Label to Packages
        call: catalog-labels.applylabeltopackages
        with:
          labelName: rest.labelName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: removelabelfrompackages
        description: JFrog Remove Label from Packages
        call: catalog-labels.removelabelfrompackages
        with:
          labelName: rest.labelName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: catalog-labels-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Catalog REST API — Labels. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: jfrog-list-labels
      description: JFrog List Labels
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: catalog-labels.listlabels
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-create-label
      description: JFrog Create Label
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: catalog-labels.createlabel
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-label
      description: JFrog Get Label
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: catalog-labels.getlabel
      with:
        labelName: tools.labelName
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-update-label
      description: JFrog Update Label
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: catalog-labels.updatelabel
      with:
        labelName: tools.labelName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-delete-label
      description: JFrog Delete Label
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: catalog-labels.deletelabel
      with:
        labelName: tools.labelName
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-apply-label-packages
      description: JFrog Apply Label to Packages
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: catalog-labels.applylabeltopackages
      with:
        labelName: tools.labelName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-remove-label-packages
      description: JFrog Remove Label from Packages
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: catalog-labels.removelabelfrompackages
      with:
        labelName: tools.labelName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
