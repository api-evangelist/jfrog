naftiko: 1.0.0-alpha2
info:
  label: JFrog Connect REST API — Updates
  description: 'JFrog Connect REST API — Updates. 4 operations. Lead operation: JFrog List Updates. Self-contained Naftiko
    capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Updates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-updates
    baseUri: https://api.connect.jfrog.io/v2
    description: JFrog Connect REST API — Updates business capability. Self-contained, no shared references.
    resources:
    - name: projects-projectId-updates
      path: /projects/{projectId}/updates
      operations:
      - name: listupdates
        method: GET
        description: JFrog List Updates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          description: Project ID
          required: true
        - name: status
          in: query
          type: string
          description: Filter by update status
      - name: createupdate
        method: POST
        description: JFrog Create Update
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          description: Project ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: projects-projectId-updates-updateId
      path: /projects/{projectId}/updates/{updateId}
      operations:
      - name: getupdate
        method: GET
        description: JFrog Get Update
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          description: Project ID
          required: true
        - name: updateId
          in: path
          type: string
          description: Update ID
          required: true
    - name: projects-projectId-updates-updateId-cancel
      path: /projects/{projectId}/updates/{updateId}/cancel
      operations:
      - name: cancelupdate
        method: POST
        description: JFrog Cancel Update
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          description: Project ID
          required: true
        - name: updateId
          in: path
          type: string
          description: Update ID
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.JFROG_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: connect-updates-rest
    port: 8080
    description: REST adapter for JFrog Connect REST API — Updates. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects/{projectid}/updates
      name: projects-projectid-updates
      description: REST surface for projects-projectId-updates.
      operations:
      - method: GET
        name: listupdates
        description: JFrog List Updates
        call: connect-updates.listupdates
        with:
          projectId: rest.projectId
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createupdate
        description: JFrog Create Update
        call: connect-updates.createupdate
        with:
          projectId: rest.projectId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{projectid}/updates/{updateid}
      name: projects-projectid-updates-updateid
      description: REST surface for projects-projectId-updates-updateId.
      operations:
      - method: GET
        name: getupdate
        description: JFrog Get Update
        call: connect-updates.getupdate
        with:
          projectId: rest.projectId
          updateId: rest.updateId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{projectid}/updates/{updateid}/cancel
      name: projects-projectid-updates-updateid-cancel
      description: REST surface for projects-projectId-updates-updateId-cancel.
      operations:
      - method: POST
        name: cancelupdate
        description: JFrog Cancel Update
        call: connect-updates.cancelupdate
        with:
          projectId: rest.projectId
          updateId: rest.updateId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-updates-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Connect REST API — Updates. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: jfrog-list-updates
      description: JFrog List Updates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-updates.listupdates
      with:
        projectId: tools.projectId
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-create-update
      description: JFrog Create Update
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connect-updates.createupdate
      with:
        projectId: tools.projectId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-update
      description: JFrog Get Update
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-updates.getupdate
      with:
        projectId: tools.projectId
        updateId: tools.updateId
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-cancel-update
      description: JFrog Cancel Update
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connect-updates.cancelupdate
      with:
        projectId: tools.projectId
        updateId: tools.updateId
      outputParameters:
      - type: object
        mapping: $.
