naftiko: 1.0.0-alpha2
info:
  label: JFrog Mission Control REST API — JPDs
  description: 'JFrog Mission Control REST API — JPDs. 5 operations. Lead operation: JFrog List JPDs. Self-contained Naftiko
    capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - JPDs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: mission-control-jpds
    baseUri: https://{server}.jfrog.io/mc/api
    description: JFrog Mission Control REST API — JPDs business capability. Self-contained, no shared references.
    resources:
    - name: v3-jpds
      path: /v3/jpds
      operations:
      - name: listjpds
        method: GET
        description: JFrog List JPDs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: addjpd
        method: POST
        description: JFrog Add JPD
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v3-jpds-jpdId
      path: /v3/jpds/{jpdId}
      operations:
      - name: getjpd
        method: GET
        description: JFrog Get JPD
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jpdId
          in: path
          type: string
          description: JPD ID
          required: true
      - name: updatejpd
        method: PUT
        description: JFrog Update JPD
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jpdId
          in: path
          type: string
          description: JPD ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: removejpd
        method: DELETE
        description: JFrog Remove JPD
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jpdId
          in: path
          type: string
          description: JPD ID
          required: true
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: mission-control-jpds-rest
    port: 8080
    description: REST adapter for JFrog Mission Control REST API — JPDs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v3/jpds
      name: v3-jpds
      description: REST surface for v3-jpds.
      operations:
      - method: GET
        name: listjpds
        description: JFrog List JPDs
        call: mission-control-jpds.listjpds
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: addjpd
        description: JFrog Add JPD
        call: mission-control-jpds.addjpd
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/jpds/{jpdid}
      name: v3-jpds-jpdid
      description: REST surface for v3-jpds-jpdId.
      operations:
      - method: GET
        name: getjpd
        description: JFrog Get JPD
        call: mission-control-jpds.getjpd
        with:
          jpdId: rest.jpdId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatejpd
        description: JFrog Update JPD
        call: mission-control-jpds.updatejpd
        with:
          jpdId: rest.jpdId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: removejpd
        description: JFrog Remove JPD
        call: mission-control-jpds.removejpd
        with:
          jpdId: rest.jpdId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: mission-control-jpds-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Mission Control REST API — JPDs. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: jfrog-list-jpds
      description: JFrog List JPDs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: mission-control-jpds.listjpds
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-add-jpd
      description: JFrog Add JPD
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: mission-control-jpds.addjpd
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-jpd
      description: JFrog Get JPD
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: mission-control-jpds.getjpd
      with:
        jpdId: tools.jpdId
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-update-jpd
      description: JFrog Update JPD
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: mission-control-jpds.updatejpd
      with:
        jpdId: tools.jpdId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-remove-jpd
      description: JFrog Remove JPD
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: mission-control-jpds.removejpd
      with:
        jpdId: tools.jpdId
      outputParameters:
      - type: object
        mapping: $.
