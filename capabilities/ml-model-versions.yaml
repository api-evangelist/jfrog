naftiko: 1.0.0-alpha2
info:
  label: JFrog ML REST API — Model Versions
  description: 'JFrog ML REST API — Model Versions. 4 operations. Lead operation: JFrog List Model Versions. Self-contained
    Naftiko capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Model Versions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: ml-model-versions
    baseUri: https://{server}.jfrog.io/ml/api
    description: JFrog ML REST API — Model Versions business capability. Self-contained, no shared references.
    resources:
    - name: v1-models-modelId-versions
      path: /v1/models/{modelId}/versions
      operations:
      - name: listmodelversions
        method: GET
        description: JFrog List Model Versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: modelId
          in: path
          type: string
          description: Model ID
          required: true
      - name: createmodelversion
        method: POST
        description: JFrog Create Model Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: modelId
          in: path
          type: string
          description: Model ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-models-modelId-versions-versionId
      path: /v1/models/{modelId}/versions/{versionId}
      operations:
      - name: getmodelversion
        method: GET
        description: JFrog Get Model Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: modelId
          in: path
          type: string
          description: Model ID
          required: true
        - name: versionId
          in: path
          type: string
          description: Version ID
          required: true
      - name: deletemodelversion
        method: DELETE
        description: JFrog Delete Model Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: modelId
          in: path
          type: string
          description: Model ID
          required: true
        - name: versionId
          in: path
          type: string
          description: Version ID
          required: true
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: ml-model-versions-rest
    port: 8080
    description: REST adapter for JFrog ML REST API — Model Versions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/models/{modelid}/versions
      name: v1-models-modelid-versions
      description: REST surface for v1-models-modelId-versions.
      operations:
      - method: GET
        name: listmodelversions
        description: JFrog List Model Versions
        call: ml-model-versions.listmodelversions
        with:
          modelId: rest.modelId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createmodelversion
        description: JFrog Create Model Version
        call: ml-model-versions.createmodelversion
        with:
          modelId: rest.modelId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/models/{modelid}/versions/{versionid}
      name: v1-models-modelid-versions-versionid
      description: REST surface for v1-models-modelId-versions-versionId.
      operations:
      - method: GET
        name: getmodelversion
        description: JFrog Get Model Version
        call: ml-model-versions.getmodelversion
        with:
          modelId: rest.modelId
          versionId: rest.versionId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletemodelversion
        description: JFrog Delete Model Version
        call: ml-model-versions.deletemodelversion
        with:
          modelId: rest.modelId
          versionId: rest.versionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ml-model-versions-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog ML REST API — Model Versions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: jfrog-list-model-versions
      description: JFrog List Model Versions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ml-model-versions.listmodelversions
      with:
        modelId: tools.modelId
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-create-model-version
      description: JFrog Create Model Version
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ml-model-versions.createmodelversion
      with:
        modelId: tools.modelId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-model-version
      description: JFrog Get Model Version
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ml-model-versions.getmodelversion
      with:
        modelId: tools.modelId
        versionId: tools.versionId
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-delete-model-version
      description: JFrog Delete Model Version
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: ml-model-versions.deletemodelversion
      with:
        modelId: tools.modelId
        versionId: tools.versionId
      outputParameters:
      - type: object
        mapping: $.
