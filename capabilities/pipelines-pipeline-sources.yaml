naftiko: 1.0.0-alpha2
info:
  label: JFrog Pipelines REST API — Pipeline Sources
  description: 'JFrog Pipelines REST API — Pipeline Sources. 4 operations. Lead operation: JFrog List Pipeline Sources. Self-contained
