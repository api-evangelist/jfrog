naftiko: 1.0.0-alpha2
info:
  label: JFrog Platform REST API — Access Tokens
  description: 'JFrog Platform REST API — Access Tokens. 4 operations. Lead operation: JFrog List Access Tokens. Self-contained
    Naftiko capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Access Tokens
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-access-tokens
    baseUri: https://{server}.jfrog.io
    description: JFrog Platform REST API — Access Tokens business capability. Self-contained, no shared references.
    resources:
    - name: access-api-v2-tokens
      path: /access/api/v2/tokens
      operations:
      - name: listtokens
        method: GET
        description: JFrog List Access Tokens
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtoken
        method: POST
        description: JFrog Create Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: access-api-v2-tokens-tokenId
      path: /access/api/v2/tokens/{tokenId}
      operations:
      - name: gettoken
        method: GET
        description: JFrog Get Token Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tokenId
          in: path
          type: string
          description: Token ID
          required: true
      - name: revoketoken
        method: DELETE
        description: JFrog Revoke Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tokenId
          in: path
          type: string
          description: Token ID
          required: true
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-access-tokens-rest
    port: 8080
    description: REST adapter for JFrog Platform REST API — Access Tokens. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/access/api/v2/tokens
      name: access-api-v2-tokens
      description: REST surface for access-api-v2-tokens.
      operations:
      - method: GET
        name: listtokens
        description: JFrog List Access Tokens
        call: platform-access-tokens.listtokens
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtoken
        description: JFrog Create Access Token
        call: platform-access-tokens.createtoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/access/api/v2/tokens/{tokenid}
      name: access-api-v2-tokens-tokenid
      description: REST surface for access-api-v2-tokens-tokenId.
      operations:
      - method: GET
        name: gettoken
        description: JFrog Get Token Details
        call: platform-access-tokens.gettoken
        with:
          tokenId: rest.tokenId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: revoketoken
        description: JFrog Revoke Access Token
        call: platform-access-tokens.revoketoken
        with:
          tokenId: rest.tokenId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-access-tokens-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Platform REST API — Access Tokens. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: jfrog-list-access-tokens
      description: JFrog List Access Tokens
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-access-tokens.listtokens
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-create-access-token
      description: JFrog Create Access Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-access-tokens.createtoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-token-details
      description: JFrog Get Token Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-access-tokens.gettoken
      with:
        tokenId: tools.tokenId
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-revoke-access-token
      description: JFrog Revoke Access Token
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: platform-access-tokens.revoketoken
      with:
        tokenId: tools.tokenId
      outputParameters:
      - type: object
        mapping: $.
