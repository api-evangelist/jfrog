naftiko: 1.0.0-alpha2
info:
  label: JFrog Access REST API — Users
  description: 'JFrog Access REST API — Users. 5 operations. Lead operation: JFrog List Users. Self-contained Naftiko capability
    covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: access-users
    baseUri: https://{server}.jfrog.io/access
    description: JFrog Access REST API — Users business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-users
      path: /api/v2/users
      operations:
      - name: listusers
        method: GET
        description: JFrog List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by user status
        - name: limit
          in: query
          type: integer
          description: Maximum number of results
        - name: offset
          in: query
          type: integer
          description: Offset for pagination
      - name: createuser
        method: POST
        description: JFrog Create User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v2-users-username
      path: /api/v2/users/{username}
      operations:
      - name: getuser
        method: GET
        description: JFrog Get User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: username
          in: path
          type: string
          description: Username
          required: true
      - name: updateuser
        method: PATCH
        description: JFrog Update User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: username
          in: path
          type: string
          description: Username
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteuser
        method: DELETE
        description: JFrog Delete User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: username
          in: path
          type: string
          description: Username
          required: true
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: access-users-rest
    port: 8080
    description: REST adapter for JFrog Access REST API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/users
      name: api-v2-users
      description: REST surface for api-v2-users.
      operations:
      - method: GET
        name: listusers
        description: JFrog List Users
        call: access-users.listusers
        with:
          status: rest.status
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createuser
        description: JFrog Create User
        call: access-users.createuser
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/users/{username}
      name: api-v2-users-username
      description: REST surface for api-v2-users-username.
      operations:
      - method: GET
        name: getuser
        description: JFrog Get User
        call: access-users.getuser
        with:
          username: rest.username
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateuser
        description: JFrog Update User
        call: access-users.updateuser
        with:
          username: rest.username
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteuser
        description: JFrog Delete User
        call: access-users.deleteuser
        with:
          username: rest.username
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: access-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Access REST API — Users. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: jfrog-list-users
      description: JFrog List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: access-users.listusers
      with:
        status: tools.status
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-create-user
      description: JFrog Create User
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: access-users.createuser
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-user
      description: JFrog Get User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: access-users.getuser
      with:
        username: tools.username
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-update-user
      description: JFrog Update User
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: access-users.updateuser
      with:
        username: tools.username
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-delete-user
      description: JFrog Delete User
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: access-users.deleteuser
      with:
        username: tools.username
      outputParameters:
      - type: object
        mapping: $.
