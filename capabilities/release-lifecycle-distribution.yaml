naftiko: 1.0.0-alpha2
info:
  label: JFrog Release Lifecycle Management REST API — Distribution
  description: 'JFrog Release Lifecycle Management REST API — Distribution. 2 operations. Lead operation: JFrog Distribute
    Release Bundle v2. Self-contained Naftiko capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Distribution
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: release-lifecycle-distribution
    baseUri: https://{server}.jfrog.io/lifecycle/api
    description: JFrog Release Lifecycle Management REST API — Distribution business capability. Self-contained, no shared
      references.
    resources:
    - name: v2-release_bundle-distribute-name-version
      path: /v2/release_bundle/distribute/{name}/{version}
      operations:
      - name: distributereleasebundle
        method: POST
        description: JFrog Distribute Release Bundle v2
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: Release bundle name
          required: true
        - name: version
          in: path
          type: string
          description: Release bundle version
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v2-release_bundle-distribute-name-version-status
      path: /v2/release_bundle/distribute/{name}/{version}/status
      operations:
      - name: getdistributionstatus
        method: GET
        description: JFrog Get Distribution Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: Release bundle name
          required: true
        - name: version
          in: path
          type: string
          description: Release bundle version
          required: true
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: release-lifecycle-distribution-rest
    port: 8080
    description: REST adapter for JFrog Release Lifecycle Management REST API — Distribution. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v2/release-bundle/distribute/{name}/{version}
      name: v2-release-bundle-distribute-name-version
      description: REST surface for v2-release_bundle-distribute-name-version.
      operations:
      - method: POST
        name: distributereleasebundle
        description: JFrog Distribute Release Bundle v2
        call: release-lifecycle-distribution.distributereleasebundle
        with:
          name: rest.name
          version: rest.version
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/release-bundle/distribute/{name}/{version}/status
      name: v2-release-bundle-distribute-name-version-status
      description: REST surface for v2-release_bundle-distribute-name-version-status.
      operations:
      - method: GET
        name: getdistributionstatus
        description: JFrog Get Distribution Status
        call: release-lifecycle-distribution.getdistributionstatus
        with:
          name: rest.name
          version: rest.version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: release-lifecycle-distribution-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Release Lifecycle Management REST API — Distribution. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: jfrog-distribute-release-bundle-v2
      description: JFrog Distribute Release Bundle v2
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: release-lifecycle-distribution.distributereleasebundle
      with:
        name: tools.name
        version: tools.version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-distribution-status
      description: JFrog Get Distribution Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: release-lifecycle-distribution.getdistributionstatus
      with:
        name: tools.name
        version: tools.version
      outputParameters:
      - type: object
        mapping: $.
