naftiko: 1.0.0-alpha2
info:
  label: JFrog Artifactory REST API — Builds
  description: 'JFrog Artifactory REST API — Builds. 4 operations. Lead operation: JFrog List All Builds. Self-contained Naftiko
    capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Builds
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: artifactory-builds
    baseUri: https://{server}.jfrog.io/artifactory
    description: JFrog Artifactory REST API — Builds business capability. Self-contained, no shared references.
    resources:
    - name: api-build
      path: /api/build
      operations:
      - name: listbuilds
        method: GET
        description: JFrog List All Builds
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-build-promote-buildName-buildNumber
      path: /api/build/promote/{buildName}/{buildNumber}
      operations:
      - name: promotebuild
        method: POST
        description: JFrog Promote Build
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: buildName
          in: path
          type: string
          description: Build name
          required: true
        - name: buildNumber
          in: path
          type: string
          description: Build number
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-build-buildName
      path: /api/build/{buildName}
      operations:
      - name: getbuildruns
        method: GET
        description: JFrog Get Build Runs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: buildName
          in: path
          type: string
          description: Build name
          required: true
    - name: api-build-buildName-buildNumber
      path: /api/build/{buildName}/{buildNumber}
      operations:
      - name: getbuildinfo
        method: GET
        description: JFrog Get Build Information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: buildName
          in: path
          type: string
          description: Build name
          required: true
        - name: buildNumber
          in: path
          type: string
          description: Build number
          required: true
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: artifactory-builds-rest
    port: 8080
    description: REST adapter for JFrog Artifactory REST API — Builds. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/build
      name: api-build
      description: REST surface for api-build.
      operations:
      - method: GET
        name: listbuilds
        description: JFrog List All Builds
        call: artifactory-builds.listbuilds
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/build/promote/{buildname}/{buildnumber}
      name: api-build-promote-buildname-buildnumber
      description: REST surface for api-build-promote-buildName-buildNumber.
      operations:
      - method: POST
        name: promotebuild
        description: JFrog Promote Build
        call: artifactory-builds.promotebuild
        with:
          buildName: rest.buildName
          buildNumber: rest.buildNumber
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/build/{buildname}
      name: api-build-buildname
      description: REST surface for api-build-buildName.
      operations:
      - method: GET
        name: getbuildruns
        description: JFrog Get Build Runs
        call: artifactory-builds.getbuildruns
        with:
          buildName: rest.buildName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/build/{buildname}/{buildnumber}
      name: api-build-buildname-buildnumber
      description: REST surface for api-build-buildName-buildNumber.
      operations:
      - method: GET
        name: getbuildinfo
        description: JFrog Get Build Information
        call: artifactory-builds.getbuildinfo
        with:
          buildName: rest.buildName
          buildNumber: rest.buildNumber
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: artifactory-builds-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Artifactory REST API — Builds. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: jfrog-list-all-builds
      description: JFrog List All Builds
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: artifactory-builds.listbuilds
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-promote-build
      description: JFrog Promote Build
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: artifactory-builds.promotebuild
      with:
        buildName: tools.buildName
        buildNumber: tools.buildNumber
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-build-runs
      description: JFrog Get Build Runs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: artifactory-builds.getbuildruns
      with:
        buildName: tools.buildName
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-build-information
      description: JFrog Get Build Information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: artifactory-builds.getbuildinfo
      with:
        buildName: tools.buildName
        buildNumber: tools.buildNumber
      outputParameters:
      - type: object
        mapping: $.
