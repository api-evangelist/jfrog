naftiko: 1.0.0-alpha2
info:
  label: JFrog Platform REST API — System
  description: 'JFrog Platform REST API — System. 2 operations. Lead operation: JFrog Get System Health. Self-contained Naftiko
    capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - System
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-system
    baseUri: https://{server}.jfrog.io
    description: JFrog Platform REST API — System business capability. Self-contained, no shared references.
    resources:
    - name: router-api-v1-system-health
      path: /router/api/v1/system/health
      operations:
      - name: getsystemhealth
        method: GET
        description: JFrog Get System Health
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: router-api-v1-system-ping
      path: /router/api/v1/system/ping
      operations:
      - name: routerping
        method: GET
        description: JFrog Platform Router Ping
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-system-rest
    port: 8080
    description: REST adapter for JFrog Platform REST API — System. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/router/api/v1/system/health
      name: router-api-v1-system-health
      description: REST surface for router-api-v1-system-health.
      operations:
      - method: GET
        name: getsystemhealth
        description: JFrog Get System Health
        call: platform-system.getsystemhealth
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/router/api/v1/system/ping
      name: router-api-v1-system-ping
      description: REST surface for router-api-v1-system-ping.
      operations:
      - method: GET
        name: routerping
        description: JFrog Platform Router Ping
        call: platform-system.routerping
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-system-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Platform REST API — System. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: jfrog-get-system-health
      description: JFrog Get System Health
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-system.getsystemhealth
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-platform-router-ping
      description: JFrog Platform Router Ping
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-system.routerping
      outputParameters:
      - type: object
        mapping: $.
