naftiko: 1.0.0-alpha2
info:
  label: JFrog Pipelines REST API — Node Pools
  description: 'JFrog Pipelines REST API — Node Pools. 4 operations. Lead operation: JFrog List Node Pools. Self-contained
    Naftiko capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Node Pools
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: pipelines-node-pools
    baseUri: https://{server}.jfrog.io/pipelines/api
    description: JFrog Pipelines REST API — Node Pools business capability. Self-contained, no shared references.
    resources:
    - name: v1-nodePools
      path: /v1/nodePools
      operations:
      - name: listnodepools
        method: GET
        description: JFrog List Node Pools
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createnodepool
        method: POST
        description: JFrog Create Node Pool
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-nodePools-nodePoolId
      path: /v1/nodePools/{nodePoolId}
      operations:
      - name: getnodepool
        method: GET
        description: JFrog Get Node Pool
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: nodePoolId
          in: path
          type: integer
          description: Node pool ID
          required: true
      - name: deletenodepool
        method: DELETE
        description: JFrog Delete Node Pool
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: nodePoolId
          in: path
          type: integer
          description: Node pool ID
          required: true
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: pipelines-node-pools-rest
    port: 8080
    description: REST adapter for JFrog Pipelines REST API — Node Pools. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/nodepools
      name: v1-nodepools
      description: REST surface for v1-nodePools.
      operations:
      - method: GET
        name: listnodepools
        description: JFrog List Node Pools
        call: pipelines-node-pools.listnodepools
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createnodepool
        description: JFrog Create Node Pool
        call: pipelines-node-pools.createnodepool
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/nodepools/{nodepoolid}
      name: v1-nodepools-nodepoolid
      description: REST surface for v1-nodePools-nodePoolId.
      operations:
      - method: GET
        name: getnodepool
        description: JFrog Get Node Pool
        call: pipelines-node-pools.getnodepool
        with:
          nodePoolId: rest.nodePoolId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletenodepool
        description: JFrog Delete Node Pool
        call: pipelines-node-pools.deletenodepool
        with:
          nodePoolId: rest.nodePoolId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pipelines-node-pools-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Pipelines REST API — Node Pools. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: jfrog-list-node-pools
      description: JFrog List Node Pools
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: pipelines-node-pools.listnodepools
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-create-node-pool
      description: JFrog Create Node Pool
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pipelines-node-pools.createnodepool
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-node-pool
      description: JFrog Get Node Pool
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: pipelines-node-pools.getnodepool
      with:
        nodePoolId: tools.nodePoolId
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-delete-node-pool
      description: JFrog Delete Node Pool
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: pipelines-node-pools.deletenodepool
      with:
        nodePoolId: tools.nodePoolId
      outputParameters:
      - type: object
        mapping: $.
