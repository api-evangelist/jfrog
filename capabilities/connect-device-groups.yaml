      path: /projects/{projectId}/device-groups
      operations:
      - name: listdevicegroups
        method: GET
        description: JFrog List Device Groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          description: Project ID
          required: true
      - name: createdevicegroup
        method: POST
        description: JFrog Create Device Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          description: Project ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
