        description: JFrog Delete Device Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          description: Project ID
          required: true
        - name: groupId
          in: path
          type: string
          description: Group ID
          required: true
