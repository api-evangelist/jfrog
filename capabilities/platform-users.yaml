    resources:
    - name: access-api-v2-users
      path: /access/api/v2/users
      operations:
      - name: listusers
        method: GET
        description: JFrog List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createuser
        method: POST
        description: JFrog Create User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: access-api-v2-users-username
      path: /access/api/v2/users/{username}
      operations:
      - name: getuser
        method: GET
        description: JFrog Get User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: username
          in: path
          type: string
          description: Username
          required: true
      - name: updateuser
        method: PATCH
        description: JFrog Update User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
