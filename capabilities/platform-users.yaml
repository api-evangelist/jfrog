        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateuser
        description: JFrog Update User
        call: platform-users.updateuser
        with:
          username: rest.username
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
