naftiko: 1.0.0-alpha2
info:
  label: JFrog Distribution REST API — Distribution
  description: 'JFrog Distribution REST API — Distribution. 3 operations. Lead operation: JFrog Distribute Release Bundle.
    Self-contained Naftiko capability covering one Jfrog business surface.'
  tags:
  - Jfrog
  - Distribution
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: distribution-distribution
    baseUri: https://{server}.jfrog.io/distribution/api
    description: JFrog Distribution REST API — Distribution business capability. Self-contained, no shared references.
    resources:
    - name: v1-distribution-name-version
      path: /v1/distribution/{name}/{version}
      operations:
      - name: distributereleasebundle
        method: POST
        description: JFrog Distribute Release Bundle
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: Release bundle name
          required: true
        - name: version
          in: path
          type: string
          description: Release bundle version
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-distribution-name-version-delete
      path: /v1/distribution/{name}/{version}/delete
      operations:
      - name: deletedistributedreleasebundle
        method: POST
        description: JFrog Delete Distributed Release Bundle
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: Release bundle name
          required: true
        - name: version
          in: path
          type: string
          description: Release bundle version
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-distribution-name-version-status
      path: /v1/distribution/{name}/{version}/status
      operations:
      - name: getdistributionstatus
        method: GET
        description: JFrog Get Distribution Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: Release bundle name
          required: true
        - name: version
          in: path
          type: string
          description: Release bundle version
          required: true
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: distribution-distribution-rest
    port: 8080
    description: REST adapter for JFrog Distribution REST API — Distribution. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/distribution/{name}/{version}
      name: v1-distribution-name-version
      description: REST surface for v1-distribution-name-version.
      operations:
      - method: POST
        name: distributereleasebundle
        description: JFrog Distribute Release Bundle
        call: distribution-distribution.distributereleasebundle
        with:
          name: rest.name
          version: rest.version
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/distribution/{name}/{version}/delete
      name: v1-distribution-name-version-delete
      description: REST surface for v1-distribution-name-version-delete.
      operations:
      - method: POST
        name: deletedistributedreleasebundle
        description: JFrog Delete Distributed Release Bundle
        call: distribution-distribution.deletedistributedreleasebundle
        with:
          name: rest.name
          version: rest.version
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/distribution/{name}/{version}/status
      name: v1-distribution-name-version-status
      description: REST surface for v1-distribution-name-version-status.
      operations:
      - method: GET
        name: getdistributionstatus
        description: JFrog Get Distribution Status
        call: distribution-distribution.getdistributionstatus
        with:
          name: rest.name
          version: rest.version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: distribution-distribution-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Distribution REST API — Distribution. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: jfrog-distribute-release-bundle
      description: JFrog Distribute Release Bundle
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: distribution-distribution.distributereleasebundle
      with:
        name: tools.name
        version: tools.version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-delete-distributed-release-bundle
      description: JFrog Delete Distributed Release Bundle
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: distribution-distribution.deletedistributedreleasebundle
      with:
        name: tools.name
        version: tools.version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-distribution-status
      description: JFrog Get Distribution Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: distribution-distribution.getdistributionstatus
      with:
        name: tools.name
        version: tools.version
      outputParameters:
      - type: object
        mapping: $.
