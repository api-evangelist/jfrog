naftiko: 1.0.0-alpha2
info:
  label: JFrog Access REST API — System
  description: 'JFrog Access REST API — System. 2 operations. Lead operation: JFrog System Ping. Self-contained Naftiko capability
    covering one Jfrog business surface.'
  tags:
  - Jfrog
  - System
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JFROG_API_KEY: JFROG_API_KEY
capability:
  consumes:
  - type: http
    namespace: access-system
    baseUri: https://{server}.jfrog.io/access
    description: JFrog Access REST API — System business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-system-ping
      path: /api/v1/system/ping
      operations:
      - name: systemping
        method: GET
        description: JFrog System Ping
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v1-system-version
      path: /api/v1/system/version
      operations:
      - name: getsystemversion
        method: GET
        description: JFrog Get System Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.JFROG_API_KEY}}'
  exposes:
  - type: rest
    namespace: access-system-rest
    port: 8080
    description: REST adapter for JFrog Access REST API — System. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v1/system/ping
      name: api-v1-system-ping
      description: REST surface for api-v1-system-ping.
      operations:
      - method: GET
        name: systemping
        description: JFrog System Ping
        call: access-system.systemping
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/system/version
      name: api-v1-system-version
      description: REST surface for api-v1-system-version.
      operations:
      - method: GET
        name: getsystemversion
        description: JFrog Get System Version
        call: access-system.getsystemversion
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: access-system-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Access REST API — System. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: jfrog-system-ping
      description: JFrog System Ping
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: access-system.systemping
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-get-system-version
      description: JFrog Get System Version
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: access-system.getsystemversion
      outputParameters:
      - type: object
        mapping: $.
