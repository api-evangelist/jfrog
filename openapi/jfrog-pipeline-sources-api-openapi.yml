openapi: 3.2.0
info:
  title: JFrog Pipelines REST Pipeline Sources API
  description: API for managing CI/CD pipelines and automation workflows. JFrog Pipelines provides continuous integration and delivery automation natively integrated with the JFrog Platform for building, testing, and deploying software.
  version: 1.x
  contact:
    name: JFrog
    url: https://jfrog.com
  license:
    name: Proprietary
    url: https://jfrog.com/terms-of-service/
  termsOfService: https://jfrog.com/terms-of-service/
servers:
- url: https://{server}.jfrog.io/pipelines/api
  description: JFrog Cloud
  variables:
    server:
      default: myserver
      description: Your JFrog server name
- url: https://{host}/pipelines/api
  description: Self-hosted JFrog instance
  variables:
    host:
      default: localhost:8082
      description: Your self-hosted JFrog server host
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Pipeline Sources
  description: Manage pipeline source configurations
paths:
  /v1/pipelineSources:
    get:
      operationId: listPipelineSources
      summary: JFrog List Pipeline Sources
      description: Returns a list of all pipeline source configurations.
      tags:
      - Pipeline Sources
      responses:
        '200':
          description: Pipeline sources list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineSource'
    post:
      operationId: createPipelineSource
      summary: JFrog Create Pipeline Source
      description: Creates a new pipeline source pointing to a repository with pipeline definitions.
      tags:
      - Pipeline Sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineSourceRequest'
      responses:
        '200':
          description: Pipeline source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineSource'
  /v1/pipelineSources/{pipelineSourceId}:
    get:
      operationId: getPipelineSource
      summary: JFrog Get Pipeline Source
      description: Returns details for a specific pipeline source.
      tags:
      - Pipeline Sources
      parameters:
      - name: pipelineSourceId
        in: path
        required: true
        schema:
          type: integer
        description: Pipeline source ID
      responses:
        '200':
          description: Pipeline source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineSource'
    delete:
      operationId: deletePipelineSource
      summary: JFrog Delete Pipeline Source
      description: Deletes a pipeline source configuration.
      tags:
      - Pipeline Sources
      parameters:
      - name: pipelineSourceId
        in: path
        required: true
        schema:
          type: integer
        description: Pipeline source ID
      responses:
        '200':
          description: Pipeline source deleted
components:
  schemas:
    PipelineSource:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        repositoryFullName:
          type: string
        branch:
          type: string
        fileFilter:
          type: string
        integrationId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PipelineSourceRequest:
      type: object
      properties:
        projectId:
          type: integer
        name:
          type: string
        repositoryFullName:
          type: string
        branch:
          type: string
        fileFilter:
          type: string
        integrationId:
          type: integer
      required:
      - repositoryFullName
      - branch
      - integrationId
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token authentication
    basicAuth:
      type: http
      scheme: basic
      description: Basic username/password authentication
externalDocs:
  description: JFrog Pipelines REST API Documentation
  url: https://www.jfrog.com/confluence/display/JFROG/Pipelines+REST+API
