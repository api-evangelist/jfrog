openapi: 3.1.0
info:
  title: JFrog Access REST Access Tokens Pipelines API
  description: API for managing users, groups, permissions, projects, and access tokens across the JFrog Platform. JFrog Access handles identity management, role-based access control, federated identity, and scoped token creation for authentication and authorization across all JFrog services.
  version: 2.x
  contact:
    name: JFrog
    url: https://jfrog.com
  license:
    name: Proprietary
    url: https://jfrog.com/terms-of-service/
  termsOfService: https://jfrog.com/terms-of-service/
servers:
- url: https://{server}.jfrog.io/access
  description: JFrog Cloud
  variables:
    server:
      default: myserver
      description: Your JFrog server name
- url: https://{host}/access
  description: Self-hosted JFrog instance
  variables:
    host:
      default: localhost:8082
      description: Your self-hosted JFrog server host
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Pipelines
  description: Pipeline definitions and management
paths:
  /v1/pipelines:
    get:
      operationId: listPipelines
      summary: JFrog List Pipelines
      description: Returns a list of all pipelines.
      tags:
      - Pipelines
      parameters:
      - name: pipelineSourceIds
        in: query
        schema:
          type: string
        description: Comma-separated list of pipeline source IDs to filter by
      - name: names
        in: query
        schema:
          type: string
        description: Comma-separated pipeline names filter
      responses:
        '200':
          description: Pipelines list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pipeline'
  /v1/pipelines/{pipelineId}:
    get:
      operationId: getPipeline
      summary: JFrog Get Pipeline
      description: Returns details for a specific pipeline.
      tags:
      - Pipelines
      parameters:
      - name: pipelineId
        in: path
        required: true
        schema:
          type: integer
        description: Pipeline ID
      responses:
        '200':
          description: Pipeline details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
components:
  schemas:
    Pipeline:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        pipelineSourceId:
          type: integer
        projectId:
          type: integer
        latestRunId:
          type: integer
        latestCompletedRunId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token authentication
    basicAuth:
      type: http
      scheme: basic
      description: Basic username/password authentication
externalDocs:
  description: JFrog Access REST API Documentation
  url: https://jfrog.com/help/r/jfrog-platform-administration-documentation/access-token-rest-api
