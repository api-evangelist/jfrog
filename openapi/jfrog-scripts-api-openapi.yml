openapi: 3.2.0
info:
  title: JFrog Mission Control REST Scripts API
  description: API for centralized management and monitoring of multiple JFrog Platform instances, including Artifactory servers, configurations, and cross-instance operations. Mission Control provides a single pane of glass for managing geographically distributed JFrog deployments.
  version: 4.x
  contact:
    name: JFrog
    url: https://jfrog.com
  license:
    name: Proprietary
    url: https://jfrog.com/terms-of-service/
  termsOfService: https://jfrog.com/terms-of-service/
servers:
- url: https://{server}.jfrog.io/mc/api
  description: JFrog Cloud
  variables:
    server:
      default: myserver
      description: Your JFrog server name
- url: https://{host}/mc/api
  description: Self-hosted JFrog instance
  variables:
    host:
      default: localhost:8082
      description: Your self-hosted JFrog server host
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Scripts
  description: Remote execution scripts
paths:
  /v1/scripts:
    get:
      operationId: listScripts
      summary: JFrog List Scripts
      description: Returns a list of all available execution scripts.
      tags:
      - Scripts
      responses:
        '200':
          description: Scripts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Script'
    post:
      operationId: createScript
      summary: JFrog Create Script
      description: Creates a new execution script.
      tags:
      - Scripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptRequest'
      responses:
        '201':
          description: Script created
  /v1/scripts/{scriptName}/execute:
    post:
      operationId: executeScript
      summary: JFrog Execute Script
      description: Executes a script on specified JPDs.
      tags:
      - Scripts
      parameters:
      - name: scriptName
        in: path
        required: true
        schema:
          type: string
        description: Script name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jpd_ids:
                  type: array
                  items:
                    type: string
                parameters:
                  type: object
                  additionalProperties:
                    type: string
              required:
              - jpd_ids
      responses:
        '200':
          description: Script execution initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_id:
                    type: string
components:
  schemas:
    Script:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        content:
          type: string
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
    ScriptRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        content:
          type: string
      required:
      - name
      - content
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token authentication
    basicAuth:
      type: http
      scheme: basic
      description: Basic username/password authentication
externalDocs:
  description: JFrog Mission Control REST API Documentation
  url: https://jfrog.com/help/r/jfrog-rest-apis/mission-control-rest-apis
