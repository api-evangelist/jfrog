openapi: 3.2.0
info:
  title: Jfrog Projects API
  version: 2.x
  contact:
    name: JFrog
    url: https://jfrog.com
  license:
    name: Proprietary
    url: https://jfrog.com/terms-of-service/
  termsOfService: https://jfrog.com/terms-of-service/
  description: 'Operations tagged Projects across 3 of this provider''s published API definitions: jfrog-access-openapi.yml, jfrog-connect-openapi.yml, jfrog-platform-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{server}.jfrog.io/access
  description: JFrog Cloud
  variables:
    server:
      default: myserver
      description: Your JFrog server name
- url: https://{host}/access
  description: Self-hosted JFrog instance
  variables:
    host:
      default: localhost:8082
      description: Your self-hosted JFrog server host
- url: https://api.connect.jfrog.io/v2
  description: JFrog Connect Cloud
- url: https://{server}.jfrog.io
  description: JFrog Cloud
  variables:
    server:
      default: myserver
      description: Your JFrog server name
- url: https://{host}
  description: Self-hosted JFrog instance
  variables:
    host:
      default: localhost:8082
      description: Your self-hosted JFrog server host
tags:
- name: Projects
  description: Project administration
paths:
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: JFrog List Projects
      description: Returns a list of all projects in the platform.
      tags:
      - Projects
      responses:
        '200':
          description: Projects list retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
      security:
      - bearerAuth: []
      - basicAuth: []
    post:
      operationId: createProject
      summary: JFrog Create Project
      description: Creates a new project with its own isolated resource scope and administration.
      tags:
      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid project configuration
        '409':
          description: Project key already exists
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://{server}.jfrog.io/access
      description: JFrog Cloud
      variables:
        server:
          default: myserver
          description: Your JFrog server name
    - url: https://{host}/access
      description: Self-hosted JFrog instance
      variables:
        host:
          default: localhost:8082
          description: Your self-hosted JFrog server host
  /api/v1/projects/{projectKey}:
    get:
      operationId: getProject
      summary: JFrog Get Project
      description: Returns details for a specific project identified by its key.
      tags:
      - Projects
      parameters:
      - name: projectKey
        in: path
        required: true
        schema:
          type: string
        description: Project key
      responses:
        '200':
          description: Project details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
      security:
      - bearerAuth: []
      - basicAuth: []
    put:
      operationId: updateProject
      summary: JFrog Update Project
      description: Updates project configuration and settings.
      tags:
      - Projects
      parameters:
      - name: projectKey
        in: path
        required: true
        schema:
          type: string
        description: Project key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Project updated
        '404':
          description: Project not found
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      operationId: deleteProject
      summary: JFrog Delete Project
      description: Permanently deletes a project and disassociates all its resources.
      tags:
      - Projects
      parameters:
      - name: projectKey
        in: path
        required: true
        schema:
          type: string
        description: Project key
      responses:
        '204':
          description: Project deleted
        '404':
          description: Project not found
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://{server}.jfrog.io/access
      description: JFrog Cloud
      variables:
        server:
          default: myserver
          description: Your JFrog server name
    - url: https://{host}/access
      description: Self-hosted JFrog instance
      variables:
        host:
          default: localhost:8082
          description: Your self-hosted JFrog server host
  /api/v1/projects/{projectKey}/users/{username}:
    put:
      operationId: addUserToProject
      summary: JFrog Add User to Project
      description: Adds a user to a project with specified role assignments.
      tags:
      - Projects
      parameters:
      - name: projectKey
        in: path
        required: true
        schema:
          type: string
        description: Project key
      - name: username
        in: path
        required: true
        schema:
          type: string
        description: Username to add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items:
                    type: string
                  description: Roles to assign (e.g., Project Admin, Developer, Viewer)
      responses:
        '200':
          description: User added to project
        '404':
          description: Project or user not found
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      operationId: removeUserFromProject
      summary: JFrog Remove User from Project
      description: Removes a user from a project, revoking all project-specific roles.
      tags:
      - Projects
      parameters:
      - name: projectKey
        in: path
        required: true
        schema:
          type: string
        description: Project key
      - name: username
        in: path
        required: true
        schema:
          type: string
        description: Username to remove
      responses:
        '204':
          description: User removed from project
        '404':
          description: Project or user not found
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://{server}.jfrog.io/access
      description: JFrog Cloud
      variables:
        server:
          default: myserver
          description: Your JFrog server name
    - url: https://{host}/access
      description: Self-hosted JFrog instance
      variables:
        host:
          default: localhost:8082
          description: Your self-hosted JFrog server host
  /api/v1/projects/{projectKey}/groups/{groupName}:
    put:
      operationId: addGroupToProject
      summary: JFrog Add Group to Project
      description: Adds a group to a project with specified role assignments.
      tags:
      - Projects
      parameters:
      - name: projectKey
        in: path
        required: true
        schema:
          type: string
        description: Project key
      - name: groupName
        in: path
        required: true
        schema:
          type: string
        description: Group name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Group added to project
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      operationId: removeGroupFromProject
      summary: JFrog Remove Group from Project
      description: Removes a group from a project.
      tags:
      - Projects
      parameters:
      - name: projectKey
        in: path
        required: true
        schema:
          type: string
        description: Project key
      - name: groupName
        in: path
        required: true
        schema:
          type: string
        description: Group name
      responses:
        '204':
          description: Group removed from project
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://{server}.jfrog.io/access
      description: JFrog Cloud
      variables:
        server:
          default: myserver
          description: Your JFrog server name
    - url: https://{host}/access
      description: Self-hosted JFrog instance
      variables:
        host:
          default: localhost:8082
          description: Your self-hosted JFrog server host
  /projects:
    get:
      operationId: listProjects
      summary: JFrog List Projects
      description: Returns a list of all projects in the account.
      tags:
      - Projects
      responses:
        '200':
          description: Projects list
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project_2'
      security:
      - apiKeyAuth: []
    post:
      operationId: createProject
      summary: JFrog Create Project
      description: Creates a new project for organizing devices.
      tags:
      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest_2'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project_2'
      security:
      - apiKeyAuth: []
    servers:
    - url: https://api.connect.jfrog.io/v2
      description: JFrog Connect Cloud
  /projects/{projectId}:
    get:
      operationId: getProject
      summary: JFrog Get Project
      description: Returns details for a specific project.
      tags:
      - Projects
      parameters:
      - name: projectId
