    delete:
      operationId: deleteProject
      summary: JFrog Delete Project
      description: Deletes a project.
      tags:
      - Projects
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
        description: Project ID
      responses:
        '204':
          description: Project deleted
      security:
      - apiKeyAuth: []
    servers:
    - url: https://api.connect.jfrog.io/v2
      description: JFrog Connect Cloud
