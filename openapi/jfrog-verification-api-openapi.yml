openapi: 3.2.0
info:
  title: JFrog Evidence REST Verification API
  description: API for creating and attaching cryptographically signed evidence to artifacts, builds, packages, and release bundles. Evidence files act as attestations providing verified records of external processes such as test results, vulnerability scans, and official approvals. Evidence is created as in-toto statements wrapped in DSSE (Dead Simple Signing Envelope) format.
  version: 1.x
  contact:
    name: JFrog
    url: https://jfrog.com
  license:
    name: Proprietary
    url: https://jfrog.com/terms-of-service/
  termsOfService: https://jfrog.com/terms-of-service/
servers:
- url: https://{server}.jfrog.io/evidence/api
  description: JFrog Cloud
  variables:
    server:
      default: myserver
      description: Your JFrog server name
- url: https://{host}/evidence/api
  description: Self-hosted JFrog instance
  variables:
    host:
      default: localhost:8082
      description: Your self-hosted JFrog server host
security:
- bearerAuth: []
tags:
- name: Verification
  description: Verify evidence and retrieve verification status
paths:
  /v1/evidence/{evidenceId}/verify:
    get:
      operationId: verifyEvidence
      summary: JFrog Verify Evidence
      description: Verifies the cryptographic signature of an evidence record against registered public keys. Returns the verification status and details.
      tags:
      - Verification
      parameters:
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
        description: Evidence record identifier
      responses:
        '200':
          description: Verification result returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
        '404':
          description: Evidence not found
components:
  schemas:
    VerificationResult:
      type: object
      properties:
        evidence_id:
          type: string
        verified:
          type: boolean
          description: Whether the signature is valid
        verification_timestamp:
          type: string
          format: date-time
        key_alias:
          type: string
          description: Alias of the public key used for verification
        signature_algorithm:
          type: string
          enum:
          - ECDSA
          - RSA
          - ED25519
        errors:
          type: array
          items:
            type: string
          description: Verification errors, if any
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token authentication. Note that basic authentication (username and password) is not supported for the Evidence API.
externalDocs:
  description: JFrog Evidence Documentation
  url: https://jfrog.com/help/r/jfrog-artifactory-documentation/create-evidence-using-rest-apis
