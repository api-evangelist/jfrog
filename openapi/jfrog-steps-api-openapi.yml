openapi: 3.1.0
info:
  title: JFrog Access REST Access Tokens Steps API
  description: API for managing users, groups, permissions, projects, and access tokens across the JFrog Platform. JFrog Access handles identity management, role-based access control, federated identity, and scoped token creation for authentication and authorization across all JFrog services.
  version: 2.x
  contact:
    name: JFrog
    url: https://jfrog.com
  license:
    name: Proprietary
    url: https://jfrog.com/terms-of-service/
  termsOfService: https://jfrog.com/terms-of-service/
servers:
- url: https://{server}.jfrog.io/access
  description: JFrog Cloud
  variables:
    server:
      default: myserver
      description: Your JFrog server name
- url: https://{host}/access
  description: Self-hosted JFrog instance
  variables:
    host:
      default: localhost:8082
      description: Your self-hosted JFrog server host
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Steps
  description: Pipeline step execution details
paths:
  /v1/steps/{stepId}:
    get:
      operationId: getStep
      summary: JFrog Get Step Details
      description: Returns details for a specific step execution.
      tags:
      - Steps
      parameters:
      - name: stepId
        in: path
        required: true
        schema:
          type: integer
        description: Step ID
      responses:
        '200':
          description: Step details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Step'
  /v1/steps/{stepId}/logs:
    get:
      operationId: getStepLogs
      summary: JFrog Get Step Logs
      description: Returns console logs for a specific step execution.
      tags:
      - Steps
      parameters:
      - name: stepId
        in: path
        required: true
        schema:
          type: integer
        description: Step ID
      responses:
        '200':
          description: Step logs retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    message:
                      type: string
components:
  schemas:
    Step:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        pipelineId:
          type: integer
        runId:
          type: integer
        typeCode:
          type: integer
        statusCode:
          type: integer
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token authentication
    basicAuth:
      type: http
      scheme: basic
      description: Basic username/password authentication
externalDocs:
  description: JFrog Access REST API Documentation
  url: https://jfrog.com/help/r/jfrog-platform-administration-documentation/access-token-rest-api
