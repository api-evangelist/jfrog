- name: JFrog Artifactory REST API
  description: REST API for managing artifacts, repositories, security, and system configuration in JFrog Artifactory. Provides
    endpoints for uploading, downloading, searching, and managing binary artifacts across all package types, including the
    Skills repository type for AI Agent Skills published via the JFrog AI Catalog.
  image: https://jfrog.com/brand/artifactory-logo.png
  baseURL: https://myserver.jfrog.io/artifactory/api
  humanURL: https://jfrog.com/artifactory/
