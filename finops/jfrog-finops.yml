specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: JFrog
providerId: jfrog
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - DevOps
  - Software Supply Chain
  - Container Registry
description: 'FOCUS-aligned FinOps for JFrog: tiered Cloud subscriptions priced by monthly base + tiered
  storage / data-transfer overage, plus self-managed annual subscriptions and optional Security and
  MLOps bundles. The dominant cost driver in Cloud is consumption (GB stored, GB transferred) above
  the included tier allotment.'
sources:
  - https://jfrog.com/pricing/
  - https://jfrog.com/help/r/jfrog-platform-administration-documentation/jfrog-subscriptions
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: JFrog Ltd.
serviceCategory: DevOps / Software Supply Chain
billingModel:
  pricingCategory: Subscription + Tiered Overage
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
    - Credit
focusColumns:
  ServiceName: JFrog Platform
  ServiceCategory: DevOps / Software Supply Chain
  ProviderName: JFrog
  PublisherName: JFrog Ltd.
  InvoiceIssuerName: JFrog Ltd.
  BillingCurrency: USD
meters:
  - name: subscription_base
    unit: month
    aggregation: sum
    dimensions:
      - tier
      - deployment
  - name: storage_consumption
    unit: GB-month
    aggregation: sum
    dimensions:
      - repository
      - package_type
      - region
  - name: data_transfer
    unit: GB
    aggregation: sum
    dimensions:
      - direction
      - region
  - name: server_subscription
    unit: server-year
    aggregation: max
    dimensions:
      - tier
  - name: security_bundle
    unit: month
    aggregation: sum
    dimensions:
      - bundle
  - name: mlops_bundle
    unit: month
    aggregation: sum
    dimensions:
      - bundle
principles:
  - name: Visibility
    description: Use the JFrog Platform Usage / Subscription dashboard and the Artifactory storage
      summary REST endpoint to see GB consumption per repository and per package type; export to your
      data warehouse for FOCUS reporting.
  - name: Allocation
    description: Tag repositories with team / product / environment metadata so storage and data-transfer
      cost can be charged back; use Projects in JFrog Platform to bound consumption per tenant.
  - name: Optimization
    description: Apply automated cleanup policies (Enterprise X+) to expire snapshots and old images,
      enable replication / federation only where business-critical, deduplicate base images, and choose
      regions to minimize cross-region transfer; lock in 3-year commits for stable workloads.
  - name: Accountability
    description: DevOps platform team owns the JFrog tenancy and reconciles monthly base + overage
      against forecast; per-team cost reviews quarterly via Projects-based showback.
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
